<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Website</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/index.js" defer></script>
</head>

<body>

<!-- Intro -->
<div id="intro">
    <h1>TropiCocoDserts</h1>
    <p class="startAnime">Click to Enter</p>
</div>

<!-- Main Content -->
<main id="home">

    <header>
        <button class="ownerPage-btn">Home</button>
        <p>TropicalCocoDessert</p>
    </header>

    <div class="main-content">
        <aside class="category-menu" id="category">
            <button class="cat active" data-cat="c1">Classical</button>
            <button class="cat" data-cat="c2">Coconut Milk</button>
            <button class="cat" data-cat="c3">Brown Sugar</button>
            <button class="cat" data-cat="c4">Black Milk Tea</button>
            <button class="cat" data-cat="c5">Crystal Snow Fungus</button>
            <button class="cat" data-cat="c6">Custom Your Own</button>
        </aside>

        <section class="category-content" id="cPage">
        </section>
    </div>

<!--    <div class="ownerPage"></div>-->

</main>

<div class="itemDetails hidden">
    <div class="itemDetails-panel">
        <button class="itemDetails-close"></button>
        <h2>Choose your toppings</h2>
        <p>Choose up to 8</p>
        <div class="topping-list" id="toppingList"></div>
        <button class="topping-add">Add to cart</button>
    </div>
</div>

<button class="viewCart hidden" id="cart">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path>
    </svg>
    <span id="cartText"></span>
</button>

</body>
</html>
